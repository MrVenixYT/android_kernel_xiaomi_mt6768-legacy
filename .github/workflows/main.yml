name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # Mengurangi beban clone
        persist-credentials: false

    - name: Fix repository ownership
      run: git config --global --add safe.directory /github/workspace

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc kmod cpio flex libncurses5-dev libelf-dev libssl-dev dwarves bison git

    - name: Setup proper toolchain
      run: |
        mkdir -p toolchain
        wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz -O toolchain.tar.gz
        tar -xzf toolchain.tar.gz -C toolchain
        rm toolchain.tar.gz
        echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

    - name: Clone and setup MemKernel
      run: |
        git clone https://github.com/Poko-Apps/MemKernel.git MemKernel
        if [ -f MemKernel/kernel/setup.sh ]; then
          bash MemKernel/kernel/setup.sh M dogi
        else
          echo "MemKernel setup.sh not found, using manual setup"
          mkdir -p drivers/memkernel
          cp MemKernel/*.[ch] drivers/memkernel/ || true
          [ -f MemKernel/Makefile ] && cp MemKernel/Makefile drivers/memkernel/
          [ -f MemKernel/Kconfig ] && cp MemKernel/Kconfig drivers/memkernel/
          echo "obj-y += memkernel/" >> drivers/Makefile
          echo "CONFIG_MEMKERNEL=y" >> arch/arm64/configs/merlin_defconfig
        fi

    - name: Build Android kernel
      env:
        ARCH: arm64
        CROSS_COMPILE: aarch64-linux-android-
        NAME: Loganysl
      run: |
        make O=out merlin_defconfig
        make -j$(nproc --all) O=out

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          out/drivers/memkernel/memkernel.ko
