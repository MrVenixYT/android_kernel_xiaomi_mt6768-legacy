name: Build Kernel with MemKernel Module

on:
  push:
    branches: [ lineage-21 ]
  pull_request:
    branches: [ lineage-21 ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc kmod cpio flex libncurses5-dev libelf-dev libssl-dev dwarves bison
        
    - name: Set up toolchain
      run: |
        mkdir toolchain
        wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz -O toolchain.tar.gz
        tar -xzf toolchain.tar.gz -C toolchain
        rm toolchain.tar.gz
        
    - name: Build kernel
      env:
        ARCH: arm64
        CROSS_COMPILE: aarch64-linux-android-
        PATH: ${{ github.workspace }}/toolchain/bin:$PATH
      run: |
        make O=out merlin_defconfig
        make -j$(nproc --all) O=out
        
    - name: Checkout MemKernel
      uses: actions/checkout@v3
      with:
        repository: anko5/MemKernel
        path: MemKernel
        
    - name: Build MemKernel module
      env:
        ARCH: arm64
        CROSS_COMPILE: aarch64-linux-android-
        KERNEL_SRC: ${{ github.workspace }}/out
        PATH: ${{ github.workspace }}/toolchain/bin:$PATH
      run: |
        cd MemKernel
        make
        
    - name: Package artifacts
      run: |
        mkdir artifacts
        cp out/arch/arm64/boot/Image.gz-dtb artifacts/
        cp MemKernel/memkernel.ko artifacts/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kernel-build
        path: artifacts/
